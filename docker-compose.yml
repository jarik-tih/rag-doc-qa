services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - S:/Practise/qdrant_storage:/qdrant/storage
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-api

    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

    depends_on:
      - qdrant